# The SmartSwitch coordinator with Prometheus and Grafana.
#   1. cp deploy/.env.example deploy/.env           # long random tokens in deploy/.env (never commit it)
#   2. mkdir deploy/keys; put fleet.json and coordinator.key there (docs/operations.md, sections 1-2);
#      the container runs as uid 10001: sudo chown 10001 deploy/keys/coordinator.key  (keep mode 0600)
#      deploy/keys/ is ignored by git; never commit it.
#   3. docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Coordinator: http://127.0.0.1:8720   Prometheus: http://127.0.0.1:9090   Grafana: http://127.0.0.1:3000
# Every port is bound to 127.0.0.1; put a TLS proxy in front before agents or keyholders use it.
# The log and its mirror are on two volumes: put the mirror volume on another disk in production.
# Image versions are tags; pin them by digest for production.
name: smartswitch

services:
  smartswitch:
    build: { context: .., dockerfile: Dockerfile }
    environment:
      SMARTSWITCH_AGENT_TOKEN: ${SMARTSWITCH_AGENT_TOKEN:?set SMARTSWITCH_AGENT_TOKEN in deploy/.env}
      SMARTSWITCH_OPERATOR_TOKEN: ${SMARTSWITCH_OPERATOR_TOKEN:?set SMARTSWITCH_OPERATOR_TOKEN in deploy/.env}
      SMARTSWITCH_OPERATOR_ALLOW: ${SMARTSWITCH_OPERATOR_ALLOW:-}
      SMARTSWITCH_ALERT_WEBHOOK: ${SMARTSWITCH_ALERT_WEBHOOK:-}
    volumes:
      - ./keys:/config:ro
      - switch-log:/data
      - switch-mirror:/mirror
    ports: ["127.0.0.1:8720:8720"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

volumes:
  switch-log:
  switch-mirror:
