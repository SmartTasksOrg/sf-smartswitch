[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartswitch"
version = "0.1.0"
description = "A quorum kill switch for AI agent fleets: no single keyholder can halt the fleet or block a halt; every agent verifies the signatures itself and stops when cut off."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartswitch", "agents", "kill-switch", "quorum", "ed25519", "fleet-safety"]
dependencies = ["cryptography>=42"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartswitch"
Issues = "https://github.com/SmartTasksOrg/sf-smartswitch/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartswitch/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartswitch/blob/main/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartswitch = "sf_smartswitch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartswitch = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
